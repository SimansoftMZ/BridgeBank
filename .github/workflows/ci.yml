name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Merge coverage reports
        run: >
          dotnet tool run reportgenerator
          -reports:"coverage/*/coverage.cobertura.xml"
          -targetdir:"coverage/report"
          -reporttypes:Cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-csharp
          path: coverage/report/Cobertura.xml
          retention-days: 7

  upload-coverage-csharp:
    name: Upload Coverage (C#)
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-csharp

      - uses: actions/upload-code-coverage@v1
        with:
          file: Cobertura.xml
          language: C#
          label: code-coverage-agent
