name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish-nuget:
    name: Publish NuGet Packages
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          dotnet pack src/BridgeBank.Core/BridgeBank.Core.csproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

          dotnet pack src/BridgeBank.Parsers/BridgeBank.Parsers.csproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

          dotnet pack src/BridgeBank.Generators/BridgeBank.Generators.csproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

          dotnet pack src/BridgeBank.ML/BridgeBank.ML.csproj \
            --configuration Release \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_PUBLISH_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/SimansoftMZ/index.json \
            --skip-duplicate

  publish-docker:
    name: Publish Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BridgeBank.Api/Dockerfile
          push: true
          tags: |
            simansoftmz/bridgebank-api:${{ steps.version.outputs.VERSION }}
            simansoftmz/bridgebank-api:latest
            ghcr.io/simansoftmz/bridgebank-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/simansoftmz/bridgebank-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
